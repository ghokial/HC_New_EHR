<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Healthcarology EHR prototype based on the supplied requirements." />
  <title>Healthcarology EHR</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="live.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <script>
    if (location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", function () {
        document.body.innerHTML = '<main style="font-family:Segoe UI,Arial;padding:48px;max-width:760px;margin:auto"><h1>Start Healthcarology EHR correctly</h1><p>This live platform cannot run by opening <code>index.html</code> directly.</p><p>Close this tab and double-click <strong>Start Healthcarology EHR.cmd</strong> in the project folder. It will open the required local web address automatically.</p></main>';
      });
    }
  </script>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-logo" src="/assets/images/healthcarology-logo.png" alt="Healthcarology"><span><strong>Healthcarology</strong><small>Electronic Health Record</small></span></div>
      <nav id="primary-nav" aria-label="Primary navigation"></nav>
      <div class="source-note"><span class="status-dot"></span><div><strong>Prototype mode</strong><small>Demonstration data only</small></div></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="search-wrap"><span>⌕</span><input id="global-search" aria-label="Search patients by name, MRN, or UNIN" placeholder="Search patient, MRN, or UNIN…" /></div>
        <div class="top-actions">
          <button class="icon-button" aria-label="Notifications">◔<span class="badge">3</span></button>
          <button class="user-menu"><span class="avatar">--</span><span><strong>Signed-in user</strong><small>Loading assigned role…</small></span><span>⌄</span></button>
        </div>
      </header>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="live-modal" class="live-modal" hidden></div>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="live.js"></script>
</body>
</html>
